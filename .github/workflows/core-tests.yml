name: Core Tests

# Unit tests for the platform-independent game rules (Packages/ColorGateRushCore).
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: swift test (Linux)
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - name: Run core tests
        working-directory: Packages/ColorGateRushCore
        run: swift test --parallel

  macos:
    name: swift test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Run core tests
        working-directory: Packages/ColorGateRushCore
        run: swift test --parallel
